name: Build GLM Office Agent

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux-only

jobs:
  build-linux:
    name: Build Linux AppImage + DEB
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies (with --prefer-offline)
        working-directory: ./glm-office-agent
        run: |
          npm install --prefer-offline --no-audit --no-fund || npm install --legacy-peer-deps
      
      - name: Clean previous builds
        working-directory: ./glm-office-agent
        run: rm -rf release out || true
      
      - name: Build Electron App
        working-directory: ./glm-office-agent
        run: npm run build
      
      - name: Package for Linux
        working-directory: ./glm-office-agent
        run: npx electron-builder --linux deb appimage --publish never
      
      - name: Verify Artifacts
        run: |
          ls -la glm-office-agent/release/
      
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            glm-office-agent/release/*.deb
            glm-office-agent/release/*.AppImage
          retention-days: 30

  create-release:
    name: Create Release
    needs: [build-linux]
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: artifacts
      
      - name: Organize Files
        run: |
          mkdir -p release/linux
          cp artifacts/*.deb release/linux/ 2>/dev/null || true
          cp artifacts/*.AppImage release/linux/ 2>/dev/null || true
          ls -laR release/
      
      - name: Calculate Checksums
        run: |
          cd release/linux
          sha256sum *.* > SHA256SUMS 2>/dev/null || echo "SHA256 checksums" > SHA256SUMS
      
      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-$(date +%Y%m%d%H%M%S)
          name: "GLM Office Agent v1.0.0 ($(date))"
          body: |
            ## GLM Office Agent v1.0.0
            
            **Build Details:**
            - Platform: Linux
            - Formats: AppImage + DEB
            - Generated: ${{ github.event.head_commit.timestamp }}
            
            **Files:**
            ✅ GLM Office Agent-1.0.0.AppImage (universal, no install)
            ✅ glm-office-agent_1.0.0_amd64.deb (Ubuntu/Debian)
          files: |
            release/linux/*.deb
            release/linux/*.AppImage
            release/linux/SHA256SUMS
          draft: false
          prerelease: false
          make_latest: true
