name: Build & Release GLM Office Agent

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - desktop-only

jobs:
  # ========================================
  # Job 1: Build Desktop Apps (Windows/macOS/Linux)
  # ========================================
  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Dependencies
        working-directory: glm-office-agent
        run: npm install
      
      - name: Build Electron App
        working-directory: glm-office-agent
        run: npm run build
      
      - name: Package for Windows
        if: matrix.os == 'windows-latest'
        working-directory: glm-office-agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never
      
      - name: Package for macOS  
        if: matrix.os == 'macos-latest'
        working-directory: glm-office-agent
        run: npx electron-builder --mac --publish never
      
      - name: Package for Linux
        if: matrix.os == 'ubuntu-latest'
        working-directory: glm-office-agent
        run: npx electron-builder --linux deb AppImage --publish never
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            glm-office-agent/release/*.exe
            glm-office-agent/release/*.dmg
            glm-office-agent/release/*.deb
            glm-office-agent/release/*.AppImage
          retention-days: 30
  
  # ========================================
  # Job 2: Publish to GitHub Releases
  # ========================================
  publish-release:
    name: Publish Release
    needs: [build-desktop]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: write
    
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      
      - name: Organize Release Files
        run: |
          mkdir -p release/{windows,macos,linux}
          
          # Windows .exe files
          cp artifacts/*.exe release/windows/ 2>/dev/null || true
          
          # macOS .dmg files
          cp artifacts/*.dmg release/macos/ 2>/dev/null || true
          
          # Linux files (.deb, .AppImage)
          cp artifacts/*.deb release/linux/ 2>/dev/null || true
          cp artifacts/*.AppImage release/linux/ 2>/dev/null || true
      
      - name: Calculate Checksums
        run: |
          cd release
          sha256sum *.* > SHA256SUMS 2>/dev/null || echo "No checksums available"
          ls -la
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/windows/*.exe
            release/macos/*.dmg
            release/linux/*.deb
            release/linux/*.AppImage
            release/SHA256SUMS
          tag_name: v${{ github.run_number }}
          name: "GLM Office Agent v${{ github.run_number }}"
          body: |
            Automated build from GitHub Actions
            
            ## Platform Support
            ✅ Windows (NSIS installer)
            ✅ macOS (DMG)  
            ✅ Linux (AppImage + DEB)
            
            ## Build Number
            Run #${{ github.run_number }}
          draft: false
          prerelease: false
