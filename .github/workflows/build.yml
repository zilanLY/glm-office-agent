name: Build GLM Office Agent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-all-platforms:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Dependencies
        working-directory: ./glm-office-agent
        run: npm ci --ignore-scripts || npm install --ignore-scripts
      
      - name: Build Application
        working-directory: ./glm-office-agent
        run: npm run build
      
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        working-directory: ./glm-office-agent
        run: npx electron-builder --win --publish never
      
      - name: Package macOS
        if: matrix.os == 'macos-latest'
        working-directory: ./glm-office-agent
        run: npx electron-builder --mac --publish never
      
      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./glm-office-agent
        run: npx electron-builder --linux deb appimage --publish never
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            glm-office-agent/release/*.exe
            glm-office-agent/release/*.dmg
            glm-office-agent/release/*.deb
            glm-office-agent/release/*.AppImage
            glm-office-agent/out/**/*
          retention-days: 7
          fail-on-empty: false
  
  create-release:
    name: Create GitHub Release
    needs: [build-all-platforms]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    
    permissions:
      contents: write
    
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: downloads
          merge-multiple: true
      
      - name: Organize Files
        run: |
          mkdir -p release/{windows,macos,linux}
          
          # Find and copy files by extension
          find downloads -name "*.exe" -exec cp {} release/windows/ \; 2>/dev/null || true
          find downloads -name "*.dmg" -exec cp {} release/macos/ \; 2>/dev/null || true
          find downloads -name "*.deb" -exec cp {} release/linux/ \; 2>/dev/null || true
          find downloads -name "*.AppImage" -exec cp {} release/linux/ \; 2>/dev/null || true
          
          echo "=== Files found ==="
          ls -laR release/
      
      - name: Generate SHA Checksums
        run: |
          cd release
          if ls *.* 1> /dev/null 2>&1; then
            sha256sum *.* > SHA256SUMS 2>/dev/null || touch README.md
          else
            echo "No files to checksum"
            touch README.md
          fi
      
      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: auto-build-${{ github.run_number }}
          name: "GLM Office Agent Auto-Build #${{ github.run_number }}"
          body: |
            ## Automated Build from GitHub Actions
            
            **Build Information:**
            - Run Number: ${{ github.run_number }}
            - Branch: ${{ github.ref }}
            - Trigger: ${{ github.event_name }}
            
            **Platforms Built:**
            ✅ Windows (NSIS installer)
            ✅ macOS (DMG image)  
            ✅ Linux (DEB + AppImage)
            
            *This is an automatically generated build.*
          files: |
            release/windows/*.exe
            release/macos/*.dmg
            release/linux/*.deb
            release/linux/*.AppImage
            release/SHA256SUMS
            release/README.md
          draft: false
          prerelease: false
          make_latest: true
