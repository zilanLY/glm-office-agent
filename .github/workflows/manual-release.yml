name: Release Pre-built Linux App

on:
  workflow_dispatch:

jobs:
  release-linux:
    name: Release Linux Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Create Directory Structure
        run: |
          mkdir -p linux-build/release/linux
      
      - name: Simulate Download (In practice, this would download from local)
        # Since we can't upload actual files from sandbox, 
        # we'll create placeholder metadata and guide user
        run: |
          echo "Repository URL: https://github.com/zilanLY/glm-office-agent" > linux-build/info.txt
          echo "Local Build Files:" >> linux-build/info.txt
          echo "- GLM Office Agent-1.0.0.AppImage (120MB)" >> linux-build/info.txt
          echo "- glm-office-agent_1.0.0_amd64.deb (81MB)" >> linux-build/info.txt
          ls -la linux-build/
      
      - name: Upload Build Info
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-info
          path: linux-build/
      
      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-local
          name: "GLM Office Agent v1.0.0 (Linux Local Build)"
          body: |
            ## GLM Office Agent v1.0.0
            
            **Build Source**: Local Sandbox Environment  
            **Date**: 2026-10-01  
            **Platform**: Linux
            
            ### Included Files:
            ✅ GLM Office Agent-1.0.0.AppImage (120MB) - Universal format  
            ✅ glm-office-agent_1.0.0_amd64.deb (81MB) - Ubuntu/Debian
            
            ### Installation Instructions:
            
            **AppImage:**
            ```bash
            chmod +x "GLM Office Agent-1.0.0.AppImage"
            ./"GLM Office Agent-1.0.0.AppImage"
            ```
            
            **DEB Package:**
            ```bash
            sudo dpkg -i glm-office-agent_1.0.0_amd64.deb
            glm-office-agent
            ```
            
            ### Note:
            These binaries were built locally and will be uploaded manually by the user via:
            https://github.com/zilanLY/glm-office-agent/releases/new
        
          draft: true
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
