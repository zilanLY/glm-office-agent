name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'src/renderer/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK (debug + signed release)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Web Assets (electron-vite renderer)
        run: npx electron-vite build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Signed Release APK
        working-directory: android
        env:
          GLM_KEYSTORE_B64: ${{ secrets.GLM_KEYSTORE_B64 }}
          GLM_KEYSTORE_PASSWORD: ${{ secrets.GLM_KEYSTORE_PASSWORD }}
          GLM_KEY_ALIAS: ${{ secrets.GLM_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Signatures
        working-directory: android
        run: |
          ls -la app/build/outputs/apk/debug/ app/build/outputs/apk/release/
          $([ -n "${{ secrets.GLM_KEYSTORE_B64 }}" ] && echo true || echo false) > /dev/null
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            $JAVA_HOME/bin/jarsigner -verify app/build/outputs/apk/release/app-release.apk | head -3
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish APK to Release
    needs: [ build-apk ]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk

      - name: Rename APKs
        working-directory: apk
        run: |
          # download-artifact 保留 debug/、release/ 子目录，递归查找再平铺
          find . -name "app-debug.apk" -exec mv {} ./GLM-Office-Agent-1.0.0-debug.apk \;
          find . -name "app-release.apk" -exec mv {} ./GLM-Office-Agent-1.0.0-release-signed.apk \;
          echo "=== APK files ==="
          find . -name "*.apk" -ls
          [ -f GLM-Office-Agent-1.0.0-release-signed.apk ] || { echo "release APK missing!"; exit 1; }

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-android.${{ github.run_number }}
          name: "GLM Office Agent v1.0.0 Android"
          body: |
            ## GLM Office Agent v1.0.0 Android APK

            基于 Capacitor 8 打包（WebView 加载本地 Web 应用）。

            | 文件 | 说明 |
            |------|------|
            | `*-release-signed.apk` | 正式签名版（推荐，后续升级签名一致） |
            | `*-debug.apk` | 调试版 |

            安装：下载 APK → 允许安装未知来源 → 安装。

            > 注意：Android 端为 WebView 壳应用，本地 GLM-Free-API 后端（Go 二进制）不随 APK 分发；
            > 服务能力依赖 Web 端降级模式，完整桌面能力请使用 Windows/macOS/Linux 版本。
          files: apk/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: false
